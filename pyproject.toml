[project]
name = "subtitle-tool"
version = "0.1.3"
description = "视频字幕生成工具：自动识别音轨语言，转写并翻译为目标语言字幕"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    # 语音识别：CTranslate2 后端，自带 PyAV(内置 FFmpeg)、tokenizers、huggingface_hub、onnxruntime(Silero VAD)
    "faster-whisper>=1.2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
subtitle-tool = "subtitle_tool.cli:main"

[project.gui-scripts]
subtitle-tool-gui = "subtitle_tool.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_tool"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# 本项目注释与用户可见文案是中文，全角标点会被判成「易混淆字符」，全是误报
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
