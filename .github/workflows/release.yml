name: make release

# 仓库里只留这一个工作流：推 v* tag 会自动发布；手动触发则按最新的 v* tag 打包，
# 两种情况都跑同一份代码——先在 Linux 上过检查，再在 Windows 上打包并发 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: 检查
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 手动触发时要能翻出全部 tag

      - name: 确定要发布哪个版本
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
          else
            name="$(git tag --list 'v*' --sort=-creatordate | head -n 1)"
            [ -n "$name" ] || { echo "仓库里还没有 v* tag，没什么可发布的"; exit 1; }
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "本次发布 $name"

      - name: 切到该 tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: git checkout "$TAG"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[gui,dev]"

      - name: 静态检查
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: 生成多音轨测试素材
        run: python scripts/make_fixture.py

      - name: 单元测试
        run: pytest -q

  build:
    name: 打包发布
    needs: test
    runs-on: windows-latest
    # 仓库的 GITHUB_TOKEN 默认只读，创建 Release 必须显式提权到 contents: write，
    # 否则最后一步会报 "Resource not accessible by integration"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[gui,dev]"

      - name: 打包
        run: pyinstaller subtitle_tool.spec --noconfirm

      - name: 冒烟测试（确认打出来的程序能跑起来）
        run: |
          $exe = "dist/subtitle-tool/SubtitleTool.exe"
          if (-not (Test-Path $exe)) { throw "没有产出可执行文件" }
          if (-not (Test-Path "dist/subtitle-tool/_internal/faster_whisper/assets/silero_vad_v6.onnx")) {
            throw "VAD 权重没打进去，运行时会找不到"
          }
          if (-not (Test-Path "dist/subtitle-tool/_internal/shipped.txt")) {
            throw "发布清单没写出来，覆盖安装时清理不掉旧文件"
          }
          "解压后体积：{0:N0} MB" -f ((Get-ChildItem dist/subtitle-tool -Recurse |
            Measure-Object -Property Length -Sum).Sum / 1MB)
          # 带参数走命令行分支：能列出音轨就说明 PyAV / CTranslate2 等原生库都加载成功
          $p = Start-Process $exe -ArgumentList "--list-tracks","tests/data/jfk.flac" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "命令行冒烟测试失败，退出码 $($p.ExitCode)" }
          # 再确认图形界面能起来且不会秒退
          $g = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          if ($g.HasExited) { throw "图形界面启动后立即退出，退出码 $($g.ExitCode)" }
          Stop-Process -Id $g.Id -Force

      - name: 压缩
        run: Compress-Archive -Path dist/subtitle-tool/* -DestinationPath subtitle-tool-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: subtitle-tool-windows-x64
          path: subtitle-tool-windows-x64.zip
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          files: subtitle-tool-windows-x64.zip
          generate_release_notes: true
