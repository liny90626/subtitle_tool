name: make release

# 仓库里只留这一个工作流：推 v* tag 会自动发布；手动触发则按最新的 v* tag 打包，
# 两种情况都跑同一份代码——先在 Linux 上过检查，再在 Windows 上打包并发 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: 检查
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 手动触发时要能翻出全部 tag

      - name: 确定要发布哪个版本
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
          else
            name="$(git tag --list 'v*' --sort=-creatordate | head -n 1)"
            [ -n "$name" ] || { echo "仓库里还没有 v* tag，没什么可发布的"; exit 1; }
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "本次发布 $name"

      - name: 切到该 tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: git checkout "$TAG"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[gui,dev]"

      - name: 静态检查
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: 生成多音轨测试素材
        run: python scripts/make_fixture.py

      - name: 单元测试
        run: pytest -q

  build:
    name: 打包发布
    needs: test
    runs-on: windows-latest
    # 仓库的 GITHUB_TOKEN 默认只读，创建 Release 必须显式提权到 contents: write，
    # 否则最后一步会报 "Resource not accessible by integration"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[gui,dev]"

      - name: 打包
        run: pyinstaller subtitle_tool.spec --noconfirm

      - name: 压缩
        run: Compress-Archive -Path dist/subtitle-tool/* -DestinationPath subtitle-tool-windows-x64.zip

      - name: 冒烟测试（在解压出来的副本上跑，验的就是用户拿到的东西）
        run: |
          Expand-Archive subtitle-tool-windows-x64.zip -DestinationPath smoke
          $exe = "smoke/SubtitleTool.exe"
          if (-not (Test-Path $exe)) { throw "压缩包里没有可执行文件" }
          if (-not (Test-Path "smoke/_internal/faster_whisper/assets/silero_vad_v6.onnx")) {
            throw "VAD 权重没进压缩包，运行时会找不到"
          }
          if (-not (Test-Path "smoke/_internal/shipped.txt")) { throw "发布清单没进压缩包" }
          if (-not (Test-Path "smoke/_internal/subtitle_tool/assets/icon.ico")) {
            throw "图标没进压缩包，窗口和任务栏就没图标了"
          }
          # 线程栈必须调大过，否则转写长片会以 0xC00000FD 整个进程消失
          $stack = python -c "import struct;d=open('smoke/SubtitleTool.exe','rb').read();p=struct.unpack_from('<I',d,0x3C)[0];print(struct.unpack_from('<Q',d,p+24+72)[0]//1048576)"
          "exe 线程栈保留 $stack MB"
          if ([int]$stack -lt 16) { throw "exe 的线程栈没调大（$stack MB），长片会栈溢出" }

          # 压缩/解压有没有漏文件——漏了的话程序会在用到那个 DLL 的时候突然消失
          $shipped = @(Get-Content "smoke/_internal/shipped.txt").Count
          $actual = @(Get-ChildItem smoke/_internal -Recurse -File).Count
          "发布清单 $shipped 项，解压出 $actual 个文件"
          if ($actual -lt $shipped) { throw "压缩包不全：解压出来的比清单少 $($shipped - $actual) 个" }

          # 真跑一整条流水线：下模型 → 转写 → 翻译 → 写字幕。
          # CTranslate2 和 onnxruntime 要到这一步才加载，--list-tracks 是验不出来的
          $p = Start-Process $exe -Wait -PassThru -ArgumentList `
            "tests/data/jfk.flac","--model","tiny","--target","zh","--model-dir","models","--output-dir","out"
          if ($p.ExitCode -ne 0) { throw "打包版跑不完整条流水线，退出码 $($p.ExitCode)" }
          if (-not (Test-Path "out/jfk.zh.srt")) { throw "没有写出字幕文件" }
          Get-Content "out/jfk.zh.srt" -Encoding utf8 | Select-Object -First 4

          # 覆盖升级：旧版残留该被清掉，清完还得能正常跑
          "旧版残留" | Out-File "smoke/_internal/leftover-from-old-version.dll"
          Remove-Item "smoke/_internal/cleaned.txt"
          $p = Start-Process $exe -Wait -PassThru -ArgumentList "--list-tracks","tests/data/jfk.flac"
          if ($p.ExitCode -ne 0) { throw "清掉残留之后跑不起来，退出码 $($p.ExitCode)" }
          if (Test-Path "smoke/_internal/leftover-from-old-version.dll") { throw "旧版残留没被清掉" }
          if (-not (Test-Path "smoke/_internal/faster_whisper/assets/silero_vad_v6.onnx")) {
            throw "清理把该留的文件删掉了"
          }

          # 日志和设置要落在 exe 同级目录，不是 %APPDATA%
          if (-not (Test-Path "smoke/subtitle-tool.log")) { throw "日志没写在 exe 同级目录" }
          if (Test-Path (Join-Path $env:APPDATA "subtitle-tool\subtitle-tool.log")) {
            throw "日志还写到 %APPDATA% 去了"
          }
          "--- 运行流水账 ---"; Get-Content "smoke/subtitle-tool.log"
          if (-not (Select-String -Path "smoke/subtitle-tool.log" -Pattern "启动子进程" -Quiet)) {
            throw "打包后的程序没能起子进程，崩溃隔离就失效了"
          }

          # 图形界面能起来且不会秒退
          $g = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          if ($g.HasExited) { throw "图形界面启动后立即退出，退出码 $($g.ExitCode)" }

          # 单例：再开一个应当自己退掉（提示框 4 秒后自动关）
          $second = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          if (-not $second.HasExited) {
            Stop-Process -Id $second.Id -Force
            Stop-Process -Id $g.Id -Force
            throw "第二个实例没退出，单例没生效"
          }
          Stop-Process -Id $g.Id -Force
          if (-not (Test-Path "smoke/settings.json")) { throw "设置没写在 exe 同级目录" }

          # 日志里出现 Traceback 就说明上面某一步悄悄出事了
          if (Select-String -Path "smoke/subtitle-tool.log" -Pattern "Traceback" -Quiet) {
            Get-Content "smoke/subtitle-tool.log"; throw "日志里有异常堆栈"
          }

          "解压后体积：{0:N0} MB" -f ((Get-ChildItem smoke -Recurse |
            Measure-Object -Property Length -Sum).Sum / 1MB)
          # 体积大头列出来，下次真要减体积时有据可依
          Get-ChildItem smoke/_internal -Recurse -File |
            Sort-Object Length -Descending | Select-Object -First 15 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }

      - uses: actions/upload-artifact@v7
        with:
          name: subtitle-tool-windows-x64
          path: subtitle-tool-windows-x64.zip
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          files: subtitle-tool-windows-x64.zip
          generate_release_notes: true
