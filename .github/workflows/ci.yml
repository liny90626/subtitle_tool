name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[gui,dev]"

      - name: 静态检查
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: 生成多音轨测试素材
        run: python scripts/make_fixture.py

      - name: 单元测试
        run: pytest -q
